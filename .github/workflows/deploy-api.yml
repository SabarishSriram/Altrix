# Deploys the read-only Altrix API to Vercel with fresh market data.
#
# Weekdays at 16:15 IST, after the NSE close: restore the stored Parquet files from the Actions cache,
# fetch only new daily bars (server/scripts/download_data.py), stage the API with
# server/scripts/stage_api_deploy.py and deploy that folder. Also runs when API code changes on
# main, and manually from the Actions tab (Run workflow).
#
# Needs repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID (README,
# "Deployment"). Until they exist the deploy job is skipped rather than failing.
name: Deploy API

on:
  # GitHub runs schedules on a best-effort basis: runs can start late or be skipped. The backup runs
  # catch a missed one; a run with no new bars just redeploys the same data.
  schedule:
    - cron: "45 10 * * 1-5"  # 16:15 IST Mon-Fri, after the NSE close (bars count as final from 16:00)
    - cron: "30 12 * * 1-5"  # 18:00 IST Mon-Fri, backup
    - cron: "30 15 * * 1-5"  # 21:00 IST Mon-Fri, backup
    - cron: "30 2 * * 2-6"   # 08:00 IST Tue-Sat, backup for the previous trading day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/api/**"
      - "server/src/**"
      - "server/app/__init__.py"
      - "server/app/dashboard.py"
      - "server/app/scanner_ui.py"
      - "server/deploy/vercel-api/**"
      - "server/scripts/download_data.py"
      - "server/scripts/stage_api_deploy.py"
      - "server/scripts/download_deliverables.py"
      - "server/data/raw/nifty100_constituents.csv"
      - "server/requirements.txt"
      - ".github/workflows/deploy-api.yml"

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
    steps:
      - id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets are not set, so the API deploy is skipped. See README, Deployment."
          fi

  keepalive:
    # Supabase pauses free projects after a week without activity; one tiny request per scheduled run
    # keeps the Investments journal database awake. Skipped until the two secrets exist. The
    # publishable key goes only in the apikey header (it is not a JWT for Authorization).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::notice::Supabase secrets are not set, so the keep-alive is skipped."
            exit 0
          fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" -d '{}' \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json"

  deploy:
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"  # same as server/deploy/vercel-api/.python-version
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        # The deploy pins as constraints, so the tests run on the versions Vercel installs.
        run: pip install -r requirements.txt -c deploy/vercel-api/requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Restore market data
        uses: actions/cache/restore@v4
        with:
          path: |
            server/data/processed
            server/data/raw
            server/data/deliverables
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-

      - name: Download new bars
        # Exit code 1 means some symbols failed or did not validate: deploy what is stored.
        run: python scripts/download_data.py || echo "::warning::download_data.py reported failures; deploying the stored data"

      - name: Download NSE deliverables (optional)
        # NSE may block GitHub's IPs; the Smart Money tab then simply omits delivery columns.
        run: python scripts/download_deliverables.py || echo "::warning::NSE deliverables unavailable; deploying without new delivery data"

      - name: Save market data
        uses: actions/cache/save@v4
        with:
          path: |
            server/data/processed
            server/data/raw
            server/data/deliverables
          key: market-data-${{ github.run_id }}

      - name: Stage API
        run: python scripts/stage_api_deploy.py "$RUNNER_TEMP/altrix-api"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Deploy to Vercel
        run: npx --yes vercel@63.1.2 deploy --prod --yes --token "$VERCEL_TOKEN" --cwd "$RUNNER_TEMP/altrix-api"
